name: Windows 验证

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - name: 类型检查、全量测试、竞态与静态检查
        run: bun run check:release
      - name: Windows WebView2 原生验收
        run: |
          bun run verify:native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Get-Content verification/native-results.json -Raw | ConvertFrom-Json
          if ($result.passed -ne $true -or $result.platform -ne 'Windows WebView2') {
            throw 'Windows 原生验收未通过'
          }
          if (!(Test-Path verification/native-window.png)) {
            throw 'Windows 原生验收缺少窗口截图'
          }
      - name: 保存原生验收结果与截图
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-native-verification
          path: |
            verification/native-results.json
            verification/native-*.png
          if-no-files-found: warn
