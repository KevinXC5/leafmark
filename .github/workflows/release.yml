name: 发布

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的版本标签（例如 v0.1.0）
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: 核对版本和发布来源
        id: version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$TAG" = "v$(jq -r .version package.json)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: 创建发布草稿
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Leafmark $TAG" --notes-file .github/release-notes.md
          fi

  check:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run check:release

  build:
    needs: [prepare, check]
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/universal" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - name: 安装 Windows 打包工具
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: 构建签名更新并上传草稿
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          test -n "$MYGO_UPDATER_PRIVATE_KEY"
          bun run build -- -platform "${{ matrix.platform }}" -skip-notarize -upload

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 发布完整版本
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts
          test -f artifacts/update-darwin-universal.json
          test -f artifacts/update-windows-amd64.json
          test -f artifacts/update-windows-arm64.json
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('artifacts')
          for manifest in root.glob('update-*.json'):
              data = json.loads(manifest.read_text())
              from urllib.parse import unquote, urlparse
              archive = root / unquote(urlparse(data['url']).path.split('/')[-1])
              assert archive.is_file() and archive.stat().st_size == data['size']
              assert data['signature']
          files = sorted(p for p in root.iterdir() if p.is_file())
          (root / 'checksums.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          PY
          gh release upload "$TAG" artifacts/checksums.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
